name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR checks, but let production deployments finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          # Keep CI aligned with the Node 24 production Docker image.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check operational scripts and delayed monitoring
        run: |
          bash -n ops/ura-backup.sh ops/ura-deploy.sh
          python3 -m py_compile ops/ura-health.py ops/ura-recovery-test.py
          python3 -m unittest discover -s ops -p 'test_*.py'

      - name: Test
        run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379

      - name: Build Directus extensions from lockfiles
        run: npm run build:extensions

      - name: Audit all dependency trees
        run: |
          npm audit --audit-level=low
          npm --prefix directus-extensions/ura-interfaces audit --audit-level=low
          npm --prefix directus-extensions/panel-external-embed audit --audit-level=low

      - name: Build and verify the pinned Directus UI correction
        run: docker build -f Dockerfile.directus -t ura-directus:12.3.1-ura.1 .

      - name: Build (includes astro check)
        run: npm run build
        env:
          # SSR build does not call the CMS, but config.ts reads these; provide
          # harmless defaults so nothing throws during the build.
          DIRECTUS_URL: http://localhost:8055
          PUBLIC_DIRECTUS_URL: http://localhost:8055

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build:extensions
      - name: Configure restricted deployment connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519 && test -s ~/.ssh/known_hosts
      - name: Build production images once and deploy those exact images
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p .cms-build
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" manifest > .cms-build/classes.html
          test -s .cms-build/classes.html
          docker build --secret id=cms-classes,src=.cms-build/classes.html \
            --build-arg REQUIRE_CMS_CLASSES=true \
            --build-arg CMS_CLASSES_SHA256="$(sha256sum .cms-build/classes.html | cut -d ' ' -f1)" \
            --build-arg RELEASE_ID="$GITHUB_SHA" -t "ura-astro:$GITHUB_SHA" .
          docker build -f Dockerfile.directus -t ura-directus:12.3.1-ura.1 .
          docker save "ura-astro:$GITHUB_SHA" ura-directus:12.3.1-ura.1 | gzip -1 | \
            ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "deploy $GITHUB_SHA"
