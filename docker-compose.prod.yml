x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

secrets:
  cms-classes:
    file: ./.cms-build/classes.html

services:
  # 1. Your Astro Website
  astro:
    logging: *bounded-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build:
      context: .
      args:
        REQUIRE_CMS_CLASSES: "true"
      secrets:
        - cms-classes
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321" # Expose only to localhost for Nginx reverse proxy
    environment:
      - HOST=0.0.0.0
      - PORT=4321

      # URLs
      - DIRECTUS_URL=http://directus:8055 # Internal
      - PUBLIC_DIRECTUS_URL=https://cms.${DOMAIN_NAME:-ura.design} # Public
      - SITE_URL=https://${DOMAIN_NAME:-ura.design}
      # Restricted API identity, issued by setup-website-access.mjs.
      - DIRECTUS_WEBSITE_TOKEN=${DIRECTUS_WEBSITE_TOKEN:-}

      # Weather API
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - WEATHER_LOCATION=${WEATHER_LOCATION:-Berlin}
      - WEATHER_CACHE_TTL=${WEATHER_CACHE_TTL:-900}

      # Redis (if Astro uses it directly)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DIRECTUS_CONFIG_CACHE=${DIRECTUS_CONFIG_CACHE:-true}
      - DIRECTUS_CONFIG_CACHE_TTL=${DIRECTUS_CONFIG_CACHE_TTL:-3600}
      - HTML_CACHE_ENABLED=true

      # Shared secret for the /api/revalidate cache hook (called by a Directus
      # Flow on content changes). Endpoint is disabled when unset.
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}

      # Live Preview / draft mode. PREVIEW_SECRET gates ?preview=<secret> on
      # detail pages; DIRECTUS_PREVIEW_TOKEN is a server-only, read-only Directus
      # token that can read drafts. Preview is disabled when either is unset.
      - PREVIEW_SECRET=${PREVIEW_SECRET:-}
      - DIRECTUS_PREVIEW_TOKEN=${DIRECTUS_PREVIEW_TOKEN:-}

      # i18n
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
      - AVAILABLE_LOCALES=${AVAILABLE_LOCALES:-en,de}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4321/en').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      directus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 2. Directus CMS
  directus:
    logging: *bounded-logging
    image: ura-directus:12.3.1-ura.1
    build:
      context: .
      dockerfile: Dockerfile.directus
    container_name: directus_cms
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055" # Expose only to localhost for Nginx reverse proxy
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      # Version-controlled schema snapshots (source of truth). `npm run
      # schema:snapshot` writes schema.json here so it can be committed; `npm run
      # schema:apply` re-applies it. Additive mount — does not touch uploads/extensions.
      - ./directus-snapshots:/directus/snapshots
    environment:
      KEY: ${KEY}
      SECRET: ${SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LICENSE_KEY: ${LICENSE_KEY:?Set LICENSE_KEY for the production CMS permissions}
      TELEMETRY: "true"
      # Host Nginx reaches this container through the project's bridge gateway.
      IP_TRUST_PROXY: ${IP_TRUST_PROXY:-loopback,172.22.0.1}
      # Prevent old-version permission/schema caches from surviving an upgrade.
      CACHE_NAMESPACE: "directus-v12"

      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-directus}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      DB_POOL__MIN: "0"
      DB_POOL__MAX: "10"

      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      # Purge the Directus response cache on every item mutation so editor
      # changes are served fresh immediately (otherwise reads stay stale until
      # CACHE_TTL). The Astro-side cache is busted separately by the revalidate Flow.
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE:-true}
      REDIS: ${REDIS_URL:-redis://redis:6379}

      # CORS - Allow frontend to fetch assets (Lottie, images, etc.)
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://${DOMAIN_NAME:-ura.design},https://cms.${DOMAIN_NAME:-ura.design}}"
      CORS_METHODS: "GET,POST,PATCH,DELETE"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
      CORS_EXPOSED_HEADERS: "Content-Range"
      CORS_CREDENTIALS: "true"
      CORS_MAX_AGE: "18000"

      # IMPORTANT: Public URL must match the domain configured in Nginx
      PUBLIC_URL: https://cms.${DOMAIN_NAME:-ura.design}
      WEBSOCKETS_ENABLED: "true"

      # Allow the admin Live Preview pane to embed the Astro frontend in an
      # iframe (frame-src otherwise falls back to the default child-src
      # 'self' blob:, which blocks the cross-origin frontend). Also whitelists
      # self-hosted tools surfaced by the External Tools dashboard (Plausible).
      # Override/extend via CSP_FRAME_SRC in .env (e.g. add HedgeDoc/Nextcloud origins).
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "${CSP_FRAME_SRC:-'self' https://ura.design https://stats.ura.design blob:}"

      # File Upload Settings
      FILES_MAX_UPLOAD_SIZE: "500MB"
      ASSETS_CACHE_TTL: "5m"
      ASSETS_TRANSFORM_MAX_CONCURRENT: "2"

      # Abuse protection. Steady-state traffic is served from the Redis config
      # cache + Astro HTML micro-cache, so few uncached calls reach Directus.
      # Rate limiting is opt-in (set RATE_LIMITER_ENABLED=true in .env once cache
      # hit-rates are confirmed) to guarantee a non-breaking deploy; the query
      # ceiling is always safe — it only rejects abusive oversized queries.
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      RATE_LIMITER_STORE: "redis"
      RATE_LIMITER_POINTS: ${RATE_LIMITER_POINTS:-100}
      RATE_LIMITER_DURATION: ${RATE_LIMITER_DURATION:-1}
      RATE_LIMITER_GLOBAL_ENABLED: "true"
      RATE_LIMITER_GLOBAL_STORE: "redis"
      RATE_LIMITER_GLOBAL_POINTS: "500"
      RATE_LIMITER_GLOBAL_DURATION: "1"
      QUERY_LIMIT_MAX: ${QUERY_LIMIT_MAX:-5000}

      # Email / SMTP
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ura.design}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      # Validate SMTP TLS certs by default; override to false only for providers
      # whose cert chain requires it (e.g. ProtonMail direct SMTP).
      EMAIL_SMTP_TLS_REJECT_UNAUTHORIZED: ${EMAIL_SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8055/server/ping').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 3. Database
  postgres:
    logging: *bounded-logging
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=128MB", "-c", "work_mem=2MB", "-c", "effective_cache_size=384MB"]
    container_name: directus_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      # PostgreSQL 18 stores its cluster in 18/docker below this mount.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      POSTGRES_DB: ${POSTGRES_DB:-directus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # 4. Redis (Cache)
  redis:
    logging: *bounded-logging
    image: redis:8.2.9-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    deploy:
      resources:
        limits:
          memory: 384M
    container_name: ura_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    environment:
      # Optional: set REDIS_PASSWORD in .env to enable authentication. When set,
      # also point the app (REDIS_PASSWORD) and Directus (REDIS url with auth) at it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Cap memory + evict least-recently-used keys so the cache can't grow
    # unbounded. requirepass is enabled only when REDIS_PASSWORD is provided.
    command: >
      sh -c "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction ${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  redis_data:
