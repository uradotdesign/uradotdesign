server {
    listen 80;
    listen [::]:80;
    server_name ura.design www.ura.design;
    return 308 https://ura.design$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name cms.ura.design;
    return 308 https://cms.ura.design$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ura.design;
    ssl_certificate /etc/letsencrypt/live/ura.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ura.design/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://ura.design$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ura.design;
    ssl_certificate /etc/letsencrypt/live/ura.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ura.design/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        include /etc/nginx/snippets/proxy-privacy.conf;
        proxy_pass http://ura_astro;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Only Astro's fingerprinted output has an immutable URL.
    location ^~ /_astro/ {
        alias /var/lib/ura-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.ura.design;
    ssl_certificate /etc/letsencrypt/live/cms.ura.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.ura.design/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 500M;
    location / {
        include /etc/nginx/snippets/proxy-privacy.conf;
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    # Directus decides whether a file is public/private and its cache lifetime.
    location /assets/ {
        include /etc/nginx/snippets/proxy-privacy.conf;
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
